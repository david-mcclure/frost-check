name: Daily Weather Text Alert

on:
  schedule:
    - cron: '0 14 * * *' # Runs daily at 14:00 UTC (7:00 AM MST)
  workflow_dispatch:
    inputs:
        debug_mode:
          description: 'Force text alert (Debug Mode)'
          required: false
          type: boolean
          default: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_SMS: ${{ secrets.RECIPIENT_SMS }}
          PUSHOVER_APP_API_TOKEN: ${{ secrets.PUSHOVER_APP_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          DEBUG_MODE: ${{ inputs.debug_mode }}
        run: python weather_monitor.py
