name: Daily Weather Text Alert

on:
  schedule:
    # Runs at 8:17 AM and 8:17 PM America/Denver year-round (auto-adjusts for MST/MDT).
    # Using minute 17 (no leading zero) avoids top-of-the-hour GitHub queue drops.
    - cron: '17 8,20 * * *'
      timezone: 'America/Denver'
  workflow_dispatch:
    inputs:
      force_text:
        description: 'Debug Tool: Forces a text alert even if no freezing'
        required: false
        type: boolean
        default: false
      override_freezing_temp:
        description: 'Debug Tool: Override freezing temp from 32'
        required: false
        type: string
        default: ""

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          PUSHOVER_APP_API_TOKEN: ${{ secrets.PUSHOVER_APP_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          FORCE_TEXT: ${{ inputs.force_text }}
          OVERRIDE_FREEZING_TEMP: ${{ inputs.override_freezing_temp }}
        run: python weather_monitor.py
