name: Daily Weather Text Alert

on:
  schedule:
    # Trigger every day at 02:00 UTC and 14:00 UTC.
    # This corresponds to:
    # - Summer (MDT): 8:00 PM and 8:00 AM (Runs instantly)
    # - Winter (MST): 7:00 PM and 7:00 AM (Dynamic Timezone Alignment forces sleep for 1 hour to align to 8:00)
    - cron: '05 2,3,14,15 * * *'
    # - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
        run_now:
          description: 'Debug Tool: Forces script to run now by ignoring Dynamic Timezone Alignment'
          required: false
          type: boolean
          default: false
        force_text:
          description: 'Debug Tool: Forces a text alert even if no freezing'
          required: false
          type: boolean
          default: false
        override_freezing_temp:
          description: 'Debug Tool: Override freezing temp from 32'
          required: false
          type: string
          default: ""

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Calculate if the runner is currently on MST (UTC-7) or MDT (UTC-6)
      # If it is MST, we pause (sleep) for 1 hour so the script runs at 8 PM local time
      - name: Dynamic Timezone Alignment
        env:
          RUN_NOW: ${{ inputs.run_now }}
        run: |
          # 1. Check if RUN_NOW is enabled first
          if [ "$RUN_NOW" = "true" ]; then
            echo "⚠️ RUN_NOW is set to true. Bypassing timezone alignment and proceeding immediately."
            exit 0
          fi

          # 2. Get the current hour (00-23) in America/Denver timezone
          LOCAL_HOUR=$(TZ="America/Denver" date +"%H")
          echo "Current local hour in Denver is: $LOCAL_HOUR"

          # 3. If it is 8 AM (08) or 8 PM (20), proceed. Otherwise, cancel the run.
          if [ "$LOCAL_HOUR" = "08" ] || [ "$LOCAL_HOUR" = "20" ]; then
            echo "⏰ Aligning to target hours (8 AM / 8 PM). Proceeding with execution!"
          else
            echo "💤 Not 8 AM or 8 PM local time. Cancelling this run..."

            # Send a cancellation request to GitHub's API for this specific run
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

            # Wait/sleep for up to a minute until the server-side cancellation signal stops the runner.
            sleep 60
            exit 0
          fi
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          PUSHOVER_APP_API_TOKEN: ${{ secrets.PUSHOVER_APP_API_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          FORCE_TEXT: ${{ inputs.force_text }}
          OVERRIDE_FREEZING_TEMP: ${{ inputs.override_freezing_temp }}
        run: python weather_monitor.py
